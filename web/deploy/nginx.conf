server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kivo.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/codex-acme; }
    location / { return 308 https://kivo.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kivo.example.com;
    ssl_certificate /etc/letsencrypt/live/kivo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kivo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KivoTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 700s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
}
